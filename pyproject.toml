[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "nl2sql-economic-copilot"
version = "1.0.0"
description = "Copiloto NL-to-SQL sobre indicadores económicos de México (snapshot WDI local, SQLite de solo lectura)."
requires-python = ">=3.11"
dependencies = ["pydantic-settings>=2.0,<3"]

[project.optional-dependencies]
dev = ["pytest==8.4.2"]

[tool.setuptools]
package-dir = {"" = "src"}
packages = ["app", "app.nl_sql"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
